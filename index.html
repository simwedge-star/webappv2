<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>튜터 웹앱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="entryScreen">
    <div class="entry-card">
      <h1>튜터 웹앱</h1>
      <p>튜터 이름을 입력하고 수업 정보를 확인하세요.</p>

      <label for="entryInput">튜터 이름</label>
      <input id="entryInput" type="text" autocomplete="name" placeholder="예: 김민수">

      <button id="loginBtn" type="button">시작하기</button>
      <div class="entry-hint">입력한 이름은 이 기기에 저장되어 다음에 자동으로 들어갑니다.</div>
    </div>
  </div>

  <div id="appScreen">
    <header class="app-header">
      <div>
        <div class="app-header-label">현재 튜터</div>
        <div id="headerTutorName">튜터님</div>
      </div>
      <button id="logoutBtn" type="button">나가기</button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <div class="sidebar-section-label">조회</div>
        <a class="nav-item active" href="#dateLookupPanel" data-panel-target="dateLookupPanel">
          <span class="nav-icon" aria-hidden="true">📅</span>
          <span>날짜 조회</span>
        </a>
        <a class="nav-item" href="#weeklyPanel" data-panel-target="weeklyPanel">
          <span class="nav-icon" aria-hidden="true">🗓️</span>
          <span>이번 주 스케줄</span>
        </a>
      </aside>

      <main class="wrap">
        <section class="content-panel date-panel active" id="dateLookupPanel">
          <div class="panel-heading">
            <h1>날짜 조회</h1>
            <p>캘린더에서 날짜를 고르고 수업 정보를 불러옵니다.</p>
          </div>

          <section class="calendar-card" aria-label="날짜 선택">
            <div class="calendar-header">
              <button class="calendar-nav" id="prevMonthBtn" type="button" aria-label="이전 달">&#8249;</button>
              <div class="calendar-title" id="calendarTitle">날짜 불러오는 중</div>
              <button class="calendar-nav" id="nextMonthBtn" type="button" aria-label="다음 달">&#8250;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="calendar-loading" id="calendarLoading">날짜를 불러오는 중...</div>
            <div class="selected-date-badge" id="selectedDateBadge">
              <span>선택한 날짜</span>
              <strong id="selectedDateText"></strong>
            </div>
          </section>

          <button id="loadBtn" type="button">불러오기</button>

          <div id="result">아직 불러온 내용이 없습니다.</div>
        </section>

        <section class="content-panel weekly-panel" id="weeklyPanel" hidden>
          <div class="panel-heading panel-heading-row">
            <div>
              <h2>이번 주 스케줄</h2>
              <p>이번 주 출근 일정과 블록을 확인합니다.</p>
            </div>
            <button id="weeklyRefreshBtn" class="secondary-btn" type="button">새로고침</button>
          </div>
          <div id="weeklyLoading" class="weekly-loading">이번 주 스케줄을 불러오는 중...</div>
          <div id="weeklyContent" class="weekly-content"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
