<!DOCTYPE html>
<html lang="ko">

  <title>튜터 웹앱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>튜터 웹앱</h1>

      <option value="">튜터를 불러오는 중...</option>
    </select>

    <button id="loadBtn">불러오기</button>

    <div id="result">아직 불러온 내용이 없습니다.</div>

  </div>
  <script src="script.js"></script>
