<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script>
    // document.write로 뷰포트를 HTML 파싱 단계에서 직접 삽입
    // → Chrome이 레이아웃 잡기 전에 강제 적용, script.google.com 데스크탑 모드 우회
    (function() {
      var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      var isAndroid = /Android/.test(navigator.userAgent);
      var content;
      if (isIOS) {
        // iOS Safari: maximum-scale=1.0 → 입력창 포커스 시 자동 줌인 완전 차단
        content = 'width=device-width,initial-scale=1.0,maximum-scale=1.0,shrink-to-fit=no';
      } else if (isAndroid) {
        var w = screen.width || 390;
        content = 'width=' + w + ',initial-scale=1.0';
      } else {
        content = 'width=device-width,initial-scale=1.0';
      }
      document.write('<meta name="viewport" content="' + content + '">');
    })();
  </script>
  <title>에듀플렉스 중계점</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f5ff; --accent: #2563eb; --accent-light: #dbeafe; --accent-dark: #1d4ed8;
      --text: #1e3a5f; --muted: #6b7280; --border: #e5e7eb;
      --success: #10b981; --danger: #ef4444;
      --A: #f43f5e; --B: #0ea5e9; --C: #f97316;
      --D: #f59e0b; --E: #10b981; --F: #7c6af5;
      --shadow: 0 2px 12px rgba(37,99,235,0.10);
      --shadow-md: 0 4px 20px rgba(37,99,235,0.14);
      --r: 14px;
      --sidebar-w: 220px;
      --tabbar-h: 64px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; max-width: 100%; }
    html, body { overflow-x: hidden; width: 100%; max-width: 100vw; height: 100%; }
    body {
      font-family: 'Noto Sans KR', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-text-size-adjust: 100%; touch-action: pan-y;
    }
    /* ── iOS 전용 폰트 크기 조정 ──────────────────────
       @supports (-webkit-touch-callout: none) 은 iOS Safari에서만 매칭됨
       html font-size를 키우면 rem 단위 글자 전체가 비례 확대됨
       박스/카드 크기(px)는 그대로 유지됨
       현재 120% = 19.2px 기준. 너무 크면 115%(18.4px), 작으면 125%(20px)로 조정
    ────────────────────────────────────────────────── */
    @supports (-webkit-touch-callout: none) {
      html { font-size: 200%; }
    }
    /* ══════════════════════════════
       진입 화면
    ══════════════════════════════ */
    #entryScreen {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 20px;
      background: linear-gradient(160deg, #eff6ff 0%, #f0f5ff 60%, #fef9c3 100%);
    }
    .entry-logo-wrap {
      background: white; border-radius: 20px;
      padding: 20px 32px 16px; margin-bottom: 28px;
      box-shadow: var(--shadow-md); border: 1px solid var(--border);
      text-align: center;
    }
    .entry-logo { height: 48px; display: block; }
    .entry-branch {
      font-size: 0.78rem; font-weight: 700; color: var(--accent);
      letter-spacing: 1.2px; margin-top: 8px;
    }
    .entry-greeting { text-align: center; margin-bottom: 28px; }
    .entry-greeting .hi { font-size: 1.5rem; font-weight: 900; color: var(--text); line-height: 1.4; }
    .entry-greeting .sub { font-size: 0.88rem; color: var(--muted); margin-top: 8px; font-weight: 500; line-height: 1.5; }
    .entry-card {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow-md);
      padding: 22px 20px; width: 100%; max-width: 340px;
    }
    .entry-label { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
    .entry-input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--border); border-radius: 11px;
      font-size: 16px; font-family: inherit;
      color: var(--text); background: var(--bg);
      outline: none; margin-bottom: 12px;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .entry-input:focus { border-color: var(--accent); background: white; }
    .entry-btn {
      width: 100%; padding: 14px;
      background: var(--accent); color: white;
      border: none; border-radius: 11px;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: transform 0.1s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .entry-btn:active { background: var(--accent-dark); transform: scale(0.98); }
    .entry-hint { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.5; }
    /* ══════════════════════════════
       앱 화면 — 전체 레이아웃
    ══════════════════════════════ */
    #appScreen { display: none; height: var(--real-vh, 100vh); flex-direction: column; background: white; }
    /* 상단 헤더 */
    .app-header {
      background: white; border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
      height: 56px;
    }
    .app-header-logo { height: 26px; flex-shrink: 0; }
    .app-header-div { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .app-header-info { flex: 1; min-width: 0; }
    .app-header-branch { font-size: 0.68rem; color: var(--muted); font-weight: 600; letter-spacing: 0.3px; }
    .app-header-tutor { font-size: 0.92rem; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-header-logout {
      flex-shrink: 0; padding: 6px 11px;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: white; color: var(--muted);
      font-size: 0.75rem; font-weight: 600; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    /* 바디 (사이드바 + 콘텐츠) */
    .app-body { display: flex; flex: 1; min-height: 0; }
    /* 사이드바 (데스크탑) */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: white; border-right: 1px solid var(--border);
      padding: 16px 10px;
      display: none; flex-direction: column; gap: 2px;
      position: sticky; top: 56px; height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .sidebar-section-label {
      font-size: 0.68rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.8px; text-transform: uppercase;
      padding: 0 10px; margin: 10px 0 4px;
    }
    .sidebar-section-label:first-child { margin-top: 0; }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 10px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 600; color: var(--muted);
      cursor: pointer; transition: all 0.13s;
      border: none; background: none; width: 100%;
      text-align: left; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 700; }
    .nav-icon { font-size: 1.05rem; flex-shrink: 0; }
    /* 콘텐츠 영역 */
    .app-content {
      flex: 1; min-width: 0; min-height: 0;
      overflow-y: auto; background: var(--bg);
      padding: 14px 14px calc(var(--tabbar-h) + 14px);
    }
    .content-panel { display: none; max-width: 680px; margin: 0 auto; }
    .content-panel.active { display: block; }
    /* 하단 탭바 (모바일) */
    .bottom-tabbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--tabbar-h);
      background: white; border-top: 1px solid var(--border);
      box-shadow: 0 -2px 12px rgba(37,99,235,0.08);
      display: flex; align-items: stretch; z-index: 100;
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; border: none; background: none;
      color: var(--muted); font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s; position: relative;
    }
    .tab-item.active { color: var(--accent); }
    .tab-icon { font-size: 1.25rem; line-height: 1; }
    .tab-label { font-size: 0.63rem; font-weight: 700; }
    /* 모바일 기본값: sidebar 숨김, tabbar 표시 */
    .sidebar { display: none; }
    /* 반응형: viewport 기준 */
    @media (min-width: 640px) {
      .sidebar { display: flex; }
      .bottom-tabbar { display: none; }
      .app-content { padding-bottom: 14px; }
    }
    /* 반응형: 실제 기기 해상도 기준 (viewport 무시하고 물리 해상도로) */
    @media screen and (max-device-width: 639px) {
      .sidebar { display: none !important; }
      .bottom-tabbar { display: flex !important; }
      .app-content { padding-bottom: calc(var(--tabbar-h) + 14px) !important; }
      /* 폰트/레이아웃도 기기 해상도 기준으로 적용 */
      .tab-label { font-size: 0.72rem; }
      .app-header-branch { font-size: 0.74rem; }
      .app-header-tutor  { font-size: 1rem; }
      .st-tag { font-size: 0.85rem; padding: 4px 10px; }
      .student-name { font-size: 1.12rem; }
      .wdc-mini-name { font-size: 0.93rem; }
      .wdc-mini-sub  { font-size: 0.76rem; }
      .wdc-mini-mgr  { font-size: 0.73rem; }
    }
    /* ══════════════════════════════
       공통 카드
    ══════════════════════════════ */
    .card {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 14px; margin-bottom: 12px;
    }
    /* ══════════════════════════════
       캘린더
    ══════════════════════════════ */
    .cal-card { background: white; border-radius: var(--r); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 12px 12px 10px; margin-bottom: 12px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-title { font-size: 0.9rem; font-weight: 700; }
    .cal-nav { display: flex; gap: 4px; }
    .cal-nav button {
      width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--border); background: white;
      cursor: pointer; font-size: 1rem; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .cal-weekday { font-size: 0.78rem; font-weight: 600; color: var(--muted); padding-bottom: 5px; }
    .cal-day {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border-radius: 8px; font-size: 0.92rem;
      color: #d1d5db; gap: 1px; cursor: default;
      -webkit-tap-highlight-color: transparent; min-height: 44px;
    }
    .cal-day.has-data { color: var(--text); cursor: pointer; font-weight: 600; }
    .cal-day.has-data:active { background: var(--accent-light); }
    .cal-day.selected { background: var(--accent) !important; color: white !important; }
    .cal-day.today { font-weight: 800; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
    .cal-day.selected .cal-dot { background: rgba(255,255,255,0.7); }
    /* 날짜 배지 / 배너 */
    .selected-date-badge {
      display: none; align-items: center; gap: 8px;
      background: var(--accent-light); border-radius: 10px;
      padding: 7px 12px; margin-top: 10px;
      font-size: 0.85rem; color: var(--accent); font-weight: 600;
    }
    .selected-date-badge.visible { display: flex; }
    .no-sheet-banner {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px;
      padding: 12px 14px; color: #c2410c; font-size: 0.88rem; font-weight: 600;
      display: none; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .no-sheet-banner.visible { display: flex; }
    /* ══════════════════════════════
       로딩 / 에러
    ══════════════════════════════ */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2.5px solid var(--accent-light); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.75s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .loading-msg { text-align: center; padding: 28px; color: var(--muted); font-size: 0.9rem; display: none; }
    .loading-msg.visible { display: block; }
    .error-banner {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px;
      padding: 12px 14px; color: var(--danger); font-size: 0.88rem; font-weight: 600;
      display: none; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .error-banner.visible { display: flex; }
    /* ══════════════════════════════
       블록 섹션
    ══════════════════════════════ */
    .block-section { margin-bottom: 20px; padding-left: 14px; }
    .block-section:last-child { margin-bottom: 0; }
    .block-section.section-A { border-left: 4px solid var(--A); }
    .block-section.section-B { border-left: 4px solid var(--B); }
    .block-section.section-C { border-left: 4px solid var(--C); }
    .block-section.section-D { border-left: 4px solid var(--D); }
    .block-section.section-E { border-left: 4px solid var(--E); }
    .block-section.section-F { border-left: 4px solid var(--F); }
    .block-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .block-badge {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.85rem; color: white;
    }
    .badge-A { background: var(--A); } .badge-B { background: var(--B); } .badge-C { background: var(--C); }
    .badge-D { background: var(--D); } .badge-E { background: var(--E); } .badge-F { background: var(--F); }
    .block-title { font-size: 1.1rem; font-weight: 700; }
    .arrival-chip {
      background: var(--accent-light); color: var(--accent);
      border-radius: 8px; padding: 3px 10px;
      font-size: 0.9rem; font-weight: 600; margin-left: auto;
    }
    /* ══════════════════════════════
       학생 카드
    ══════════════════════════════ */
    .student-card {
      background: white; border-radius: 14px;
      border: 1px solid var(--border); box-shadow: var(--shadow);
      margin-bottom: 12px; overflow: hidden;
      display: flex; align-items: stretch;
    }
    .seat-bar { width: 8px; flex-shrink: 0; }
    .seat-bar-A{background:var(--A)} .seat-bar-B{background:var(--B)} .seat-bar-C{background:var(--C)}
    .seat-bar-D{background:var(--D)} .seat-bar-E{background:var(--E)} .seat-bar-F{background:var(--F)}
    .seat-num-A{color:var(--A)} .seat-num-B{color:var(--B)} .seat-num-C{color:var(--C)}
    .seat-num-D{color:var(--D)} .seat-num-E{color:var(--E)} .seat-num-F{color:var(--F)}
    .seat-section {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 14px 10px; flex-shrink: 0; min-width: 52px; text-align: center;
      border-right: 1px solid var(--border); gap: 3px;
    }
    .seat-num  { font-size: 1.5rem; font-weight: 900; line-height: 1; }
    .seat-room { font-size: 0.58rem; color: var(--muted); font-weight: 600; line-height: 1.4; word-break: keep-all; }
    .card-inner { flex: 1; min-width: 0; padding: 13px 12px; display: flex; align-items: center; gap: 10px; }
    .sc-body  { flex: 1; min-width: 0; }
    .sc-right { flex-shrink: 0; }
    .student-name { font-size: 1.1rem; font-weight: 700; word-break: keep-all; }
    .student-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .st-tag { border-radius: 7px; padding: 3px 9px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; background: white; }
    .tag-subject { border: 1.5px solid var(--accent); color: var(--accent); }
    .tag-meta    { border: 1.5px solid #10b981; color: #059669; }
    .tag-num     { border: 1.5px solid #94a3b8; color: #475569; }
    .tag-manager { border: 1.5px solid #f59e0b; color: #b45309; }
    .link-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 10px 13px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 700;
      text-decoration: none; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .link-btn:active { transform: scale(0.94); filter: brightness(0.93); }
    .link-btn-A{background:linear-gradient(135deg,#fff1f2,#ffe4e6);border:1.5px solid #fda4af;color:#e11d48;box-shadow:0 2px 8px rgba(244,63,94,0.16)}
    .link-btn-B{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1.5px solid #7dd3fc;color:#0284c7;box-shadow:0 2px 8px rgba(14,165,233,0.16)}
    .link-btn-C{background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fdba74;color:#ea580c;box-shadow:0 2px 8px rgba(249,115,22,0.16)}
    .link-btn-D{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1.5px solid #fcd34d;color:#d97706;box-shadow:0 2px 8px rgba(245,158,11,0.16)}
    .link-btn-E{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #6ee7b7;color:#059669;box-shadow:0 2px 8px rgba(16,185,129,0.16)}
    .link-btn-F{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;color:#7c3aed;box-shadow:0 2px 8px rgba(124,106,245,0.16)}
    .no-link-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .no-link-msg  { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .link-btn-main {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 11px; border-radius: 10px;
      border: 1px solid var(--border); background: #f9fafb;
      color: var(--muted); font-size: 0.82rem; font-weight: 600;
      text-decoration: none; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .link-btn-main:active { background: #f3f4f6; }
    /* ══════════════════════════════
       결과 헤더 / 빈 상태
    ══════════════════════════════ */
    .result-header {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 14px 16px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .result-date  { font-size: 0.8rem; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
    .result-tutor { font-size: 1.05rem; font-weight: 800; color: var(--text); }
    .open-all-btn {
      display: none;
      align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 1.5px solid #93c5fd; color: var(--accent-dark);
      font-size: 0.82rem; font-weight: 700; font-family: inherit;
      cursor: pointer; white-space: nowrap; text-decoration: none;
      transition: transform 0.12s, filter 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .open-all-btn:active { transform: scale(0.95); filter: brightness(0.93); }
    @media (min-width: 640px) { .open-all-btn { display: flex; } }
    .empty-state { text-align: center; padding: 28px; color: var(--muted); }
    .empty-state .emoji { font-size: 2rem; margin-bottom: 8px; }
    .empty-state p { font-size: 0.88rem; line-height: 1.6; }
    .results-area { margin-top: 4px; }
    /* 플레이스홀더 패널 */
    .placeholder-card {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 40px 24px; text-align: center; color: var(--muted);
    }
    .placeholder-card .ph-emoji { font-size: 2.5rem; margin-bottom: 12px; }
    .placeholder-card .ph-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .placeholder-card .ph-desc { font-size: 0.88rem; line-height: 1.6; }
    /* ══════════════════════════════
       이번 주 스케줄
    ══════════════════════════════ */
    .week-summary {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 14px 16px; margin-bottom: 16px;
      font-size: 0.88rem; color: var(--muted); font-weight: 600;
    }
    .week-summary strong { color: var(--text); }
    .week-day-card {
      background: white; border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      margin-bottom: 12px; overflow: hidden;
    }
    .week-day-card.today-card { border: 2px solid var(--accent); }
    .wdc-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.13s;
    }
    .wdc-head:hover { background: #f8faff; }
    .wdc-head:active { background: #eff6ff; }
    .wdc-weekday-badge {
      font-size: 0.75rem; font-weight: 800; padding: 3px 9px;
      border-radius: 7px; flex-shrink: 0;
      background: var(--accent-light); color: var(--accent);
    }
    .wdc-weekday-badge.weekend { background: #fff1f2; color: #e11d48; }
    .wdc-date { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .wdc-arrival {
      margin-left: auto; flex-shrink: 0;
      background: var(--accent-light); color: var(--accent);
      border-radius: 8px; padding: 3px 10px;
      font-size: 0.85rem; font-weight: 600;
    }
    .today-dot {
      display: inline-block; background: var(--accent);
      color: white; border-radius: 6px; padding: 2px 7px;
      font-size: 0.65rem; font-weight: 800; margin-left: 6px;
      vertical-align: middle;
    }
    .wdc-blocks { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
    .wdc-block-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 700;
      border: 1.5px solid transparent;
    }
    .chip-badge {
      width: 22px; height: 22px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 800; color: white; flex-shrink: 0;
    }
    .chip-A { background: var(--A); } .chip-B { background: var(--B); } .chip-C { background: var(--C); }
    .chip-D { background: var(--D); } .chip-E { background: var(--E); } .chip-F { background: var(--F); }
    .chip-text-A { color: var(--A); border-color: #fda4af; background: #fff1f2; }
    .chip-text-B { color: var(--B); border-color: #7dd3fc; background: #f0f9ff; }
    .chip-text-C { color: var(--C); border-color: #fdba74; background: #fff7ed; }
    .chip-text-D { color: var(--D); border-color: #fcd34d; background: #fffbeb; }
    .chip-text-E { color: var(--E); border-color: #6ee7b7; background: #ecfdf5; }
    .chip-text-F { color: #7c3aed; border-color: #c4b5fd; background: #f5f3ff; }
    .wdc-toggle {
      margin-left: 6px; flex-shrink: 0;
      color: var(--muted); font-size: 0.75rem;
      transition: transform 0.2s;
    }
    .week-day-card.expanded .wdc-toggle { transform: rotate(180deg); }
    .wdc-expand {
      display: none; border-top: 1px solid var(--border);
    }
    .week-day-card.expanded .wdc-expand { display: block; }
    .wdc-student-loading {
      padding: 16px; text-align: center;
      color: var(--muted); font-size: 0.88rem;
    }
    .wdc-block-section { margin-bottom: 16px; padding: 0 14px; }
    .wdc-block-section:first-child { margin-top: 14px; }
    .wdc-block-section:last-child  { margin-bottom: 14px; }
    .wdc-block-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }


    /* 이번 주 로딩 메시지 애니메이션 */
    #weekLoadingMsg { font-size: 0.92rem; }
    #weekLoadingText {
      transition: opacity 0.4s;
    }
    #weekLoadingText.fade { opacity: 0; }

    /* 이번 주 펼침 — 학생 미니 카드 */
    .wdc-student-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 7px; padding: 10px 14px 14px;
    }
    .wdc-mini-card {
      border: 1px solid var(--border); border-radius: 9px;
      padding: 9px 10px; background: #fafbff;
    }
    .wdc-mini-name {
      font-size: 0.88rem; font-weight: 800;
      margin-bottom: 4px; word-break: keep-all;
    }
    .wdc-mini-sub {
      font-size: 0.7rem; color: var(--muted); font-weight: 600;
    }
    .wdc-mini-mgr {
      font-size: 0.68rem; color: #b45309; font-weight: 600; margin-top: 3px;
    }
    /* 데스크탑 미세조정 */
    @media (min-width: 640px) {
      .seat-num { font-size: 1.7rem; }
      .student-name { font-size: 1.15rem; }
    }
    /* 모바일 가독성 개선 */
    @media (max-width: 639px) {
      .tab-label { font-size: 0.72rem; }
      .app-header-branch { font-size: 0.74rem; }
      .app-header-tutor  { font-size: 1rem; }
      .st-tag { font-size: 0.85rem; padding: 4px 10px; }
      .student-name { font-size: 1.12rem; }
      .wdc-mini-name { font-size: 0.93rem; }
      .wdc-mini-sub  { font-size: 0.76rem; }
      .wdc-mini-mgr  { font-size: 0.73rem; }
      .wdc-block-section { padding: 0 10px; }
      .wdc-student-grid { padding: 8px 10px 12px; gap: 6px; }
      .wdc-head { padding: 13px 12px; }
      .cal-day { font-size: 0.85rem; min-height: 32px; }
      .cal-weekday { font-size: 0.82rem; }
      .link-btn { font-size: 0.78rem; padding: 7px 10px; }
    }
  </style>
</head>

var mainSheetUrl = 'https://docs.google.com/spreadsheets/d/11gB12qLmMfFCpm8RsxZsvXP9Xz9raEDGvigg0N82KZ8/edit?gid=378762600#gid=378762600';

// =====================================================

function doLogin() {
  var name = document.getElementById('entryInput').value.trim();
  if (!name) { document.getElementById('entryInput').focus(); return; }
  currentTutor = name;
  try { localStorage.setItem('savedTutor', name); } catch(e) {}
  document.getElementById('headerTutorName').textContent = name + ' 튜터님';
  document.getElementById('entryScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  init();
}
function doLogout() {
  currentTutor = '';
  try { localStorage.removeItem('savedTutor'); } catch(e) {}
  weeklyLoaded = false;
  availableDateMap = {}; selectedDateKey = null; selectedGid = null;
  calYear = new Date().getFullYear(); calMonth = new Date().getMonth();
  document.getElementById('entryInput').value = '';
  document.getElementById('calCard').style.display = 'none';
  document.getElementById('calLoadingMsg').style.display = 'block';
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('selectedBadge').classList.remove('visible');
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('entryScreen').style.display = 'flex';
  switchTab('materials');
}
(function() {
  try {
    var saved = localStorage.getItem('savedTutor');
    if (saved) {
      document.getElementById('entryInput').value = saved;
      setTimeout(doLogin, 0);
    }
  } catch(e) {}
})();
// ── 레이아웃 / zoom 보정 ──────────────────────────────────────────
function applyResponsiveLayout() {
  var isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  var effectiveW = isMobileUA ? Math.min(screen.width, screen.height, window.innerWidth) : window.innerWidth;
  var sidebar = document.querySelector('.sidebar');
  var tabbar  = document.querySelector('.bottom-tabbar');
  var content = document.querySelector('.app-content');
  if (!sidebar || !tabbar) return;
  if (effectiveW >= 640) {
    sidebar.style.display = 'flex';
    tabbar.style.display  = 'none';
    if (content) content.style.paddingBottom = '14px';
  } else {
    sidebar.style.display = 'none';
    tabbar.style.display  = 'flex';
    if (content) content.style.paddingBottom = 'calc(var(--tabbar-h) + 14px)';
  }
}

// Chrome Android가 script.google.com을 강제로 980px 뷰포트로 렌더링할 때
// CSS zoom으로 내용물을 미리 키워서 보정: 2.5배 키우고 Chrome이 0.4배 줄이면 = 정상 크기
function applyZoomCompensation() {
  if (!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) return;
  var physW = screen.width;          // 실제 기기 CSS 픽셀 너비 (예: 390)
  var rendW = window.innerWidth;     // Chrome이 잡은 뷰포트 너비 (예: 980)
  if (rendW <= physW + 60) return;   // 이미 정상이면 패스
  var zoom = rendW / physW;          // 예: 2.51
  var physH = Math.round(window.innerHeight / zoom);
  var html  = document.documentElement;
  html.style.width    = physW + 'px';
  html.style.height   = physH + 'px';
  html.style.zoom     = String(zoom);
  html.style.overflowX = 'hidden';
  // height:100vh 사용 엘리먼트 보정
  html.style.setProperty('--real-vh', physH + 'px');
}

window.addEventListener('resize', applyResponsiveLayout);
window.addEventListener('load',   applyResponsiveLayout);
applyResponsiveLayout();
// zoom 보정은 DOM 완성 후 실행 (innerHeight 확보 후)
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', applyZoomCompensation);
} else {
  applyZoomCompensation();
}
// =====================================================
// 탭 전환
// =====================================================
function switchTab(tabId) {
  document.querySelectorAll('.content-panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('panel-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item, .tab-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
  if (tabId === 'week' && !weeklyLoaded) {
    loadWeeklySchedule();
  }
}
// =====================================================
// 초기화 (로그인 후 호출)
// =====================================================
function init() {
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.dates) {
        data.dates.forEach(function(d) {
          availableDateMap[d.dateKey] = { label: d.label, gid: d.gid };
        });
      }
      renderCalendar();
    })
    .withFailureHandler(function(err) {
      renderCalendar();
      showError('날짜 목록을 불러오지 못했어요: ' + (err.message || err));
    })
    .getAvailableDates()
  google.script.run
    .withSuccessHandler(function(data) {
      if (data && data.links) linkMap = data.links;
      if (data && data.managerMap) managerMap = data.managerMap;
      if (data && data.mainUrl) mainSheetUrl = data.mainUrl;
    })
    .withFailureHandler(function() {})
    .getLinkMap();
}
// =====================================================
// 캘린더 렌더링
// =====================================================
function renderCalendar() {
  document.getElementById('calLoadingMsg').style.display = 'none';
  document.getElementById('calCard').style.display = 'block';
  var monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = calYear + '년 ' + monthNames[calMonth];
  var grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach(function(d) {
    var el = document.createElement('div');
    el.className = 'cal-weekday'; el.textContent = d;
    grid.appendChild(el);
  });
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var todayStr = new Date().toISOString().slice(0,10);
  for (var i = 0; i < firstDay; i++) {
    var empty = document.createElement('div');
    empty.className = 'cal-day empty'; grid.appendChild(empty);
  }
  for (var day = 1; day <= daysInMonth; day++) {
    var m = calMonth + 1;
    var dateKey = calYear + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    var hasData = !!availableDateMap[dateKey];
    var isToday = dateKey === todayStr;
    var isSelected = dateKey === selectedDateKey;
    var el = document.createElement('div');
    el.className = 'cal-day' + (hasData ? ' has-data' : '') + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
    el.innerHTML = '<span>' + day + '</span>';
    if (hasData) {
      var dot = document.createElement('div');
      dot.className = 'cal-dot'; el.appendChild(dot);
      (function(dk) {
        el.addEventListener('click', function() { onDateClick(dk); });
      })(dateKey);
    } else {
      (function(dk) {
        el.addEventListener('click', function() { onUnavailableDateClick(dk); });
      })(dateKey);
    }
    grid.appendChild(el);
  }
}
function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0;  calYear++; }
  renderCalendar();
}
// =====================================================
// 날짜 클릭 — 자동 조회
// =====================================================
function onDateClick(dateKey) {
  selectedDateKey = dateKey;
  selectedGid = availableDateMap[dateKey].gid;
  document.getElementById('noSheetBanner').classList.remove('visible');
  var badge = document.getElementById('selectedBadge');
  badge.classList.add('visible');
  document.getElementById('selectedBadgeText').textContent = availableDateMap[dateKey].label + ' 선택됨';
  clearResults();
  renderCalendar();
  doSearch();
}
function onUnavailableDateClick(dateKey) {
  clearResults();
  selectedDateKey = null; selectedGid = null;
  document.getElementById('noSheetBanner').classList.add('visible');
  document.getElementById('selectedBadge').classList.remove('visible');
  renderCalendar();
}
// =====================================================
// 자동 조회 (currentTutor 사용)
// =====================================================
function doSearch() {
  if (!currentTutor || !selectedDateKey || !selectedGid) return;
  clearResults();
  document.getElementById('loadingMsg').classList.add('visible');
  document.getElementById('errorBanner').classList.remove('visible');
  google.script.run
    .withSuccessHandler(function(data) {
      document.getElementById('loadingMsg').classList.remove('visible');
      if (data.error) { showError(data.error); return; }
      renderResult(data, currentTutor);
    })
    .withFailureHandler(function(err) {
      document.getElementById('loadingMsg').classList.remove('visible');
      showError('조회 실패: ' + (err.message || err));
    })
    .getScheduleData(selectedDateKey, currentTutor, selectedGid);
}
// =====================================================
// 결과 렌더링
// =====================================================
function renderResult(data, tutor) {
  var area = document.getElementById('resultsArea');
  area.innerHTML = '';
  if (!data.tutorFound || !data.blocks || Object.keys(data.blocks).length === 0) {
    area.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>이 날은 <strong>' + escHtml(tutor) + '</strong> 튜터님의 수업이 없어요.</p></div>';
    return;
  }
  var dayNames = ['일','월','화','수','목','금','토'];
  var dateStr = '';
  if (selectedDateKey) {
    var d = new Date(selectedDateKey + 'T00:00:00');
    var months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    dateStr = months[d.getMonth()] + ' ' + d.getDate() + '일 ' + dayNames[d.getDay()] + '요일';
  }
  var arrival = '';
  Object.keys(data.blocks).sort().forEach(function(bk) {
    if (!arrival && data.blocks[bk].arrival) arrival = data.blocks[bk].arrival;
  });
  // 오늘 수업 통합자료 URL 전체 수집
  var allUrls = [];
  Object.keys(data.blocks).sort().forEach(function(bk) {
    var block = data.blocks[bk];
    if (block.students) {
      block.students.forEach(function(st) {
        var lk1 = st.name + (st.subject ? ' ' + st.subject : '') + (st.clipboard ? '(' + st.clipboard + ')' : '');
        var lk2 = st.subject ? (st.name + ' ' + st.subject) : st.name;
        var url = linkMap[lk1] || linkMap[lk2] || linkMap[st.name] || '';
        if (url) allUrls.push(url);
      });
    }
  });
  var resultHdr = document.createElement('div');
  resultHdr.className = 'result-header';
  var rightHtml = '';
  if (allUrls.length > 0) {
    rightHtml += '<button class="open-all-btn" onclick="openAllMaterials()" title="오늘 수업 통합자료 한번에 열기">📂 통합자료 한번에 열기 (' + allUrls.length + ')</button>';
  }
  if (arrival) {
    rightHtml += '<span class="arrival-chip">🚌 ' + escHtml(arrival) + ' 출근</span>';
  }
  resultHdr.innerHTML =
    '<div>' +
      '<div class="result-date">' + escHtml(dateStr) + '</div>' +
      '<div class="result-tutor">' + escHtml(tutor) + ' 튜터님의 수업 목록</div>' +
    '</div>' +
    (rightHtml ? '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' + rightHtml + '</div>' : '');
  // 전역에 URL 목록 저장해 버튼 onclick에서 접근
  window._todayAllUrls = allUrls;
  area.appendChild(resultHdr);
  Object.keys(data.blocks).sort().forEach(function(bk) {
    var block = data.blocks[bk];
    var section = document.createElement('div');
    section.className = 'block-section section-' + bk;
    var hdr = document.createElement('div');
    hdr.className = 'block-header';
    hdr.innerHTML = '<div class="block-badge badge-' + bk + '">' + bk + '</div><span class="block-title">' + bk + '콤마</span>';
    section.appendChild(hdr);
    if (!block.students || block.students.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<p style="padding:12px 0">이 블록에 학생이 없어요.</p>';
      section.appendChild(empty);
    } else {
      block.students.forEach(function(st, idx) {
        section.appendChild(renderStudentCard(st, idx + 1, bk));
      });
    }
    area.appendChild(section);
  });
}
function openAllMaterials() {
  var urls = window._todayAllUrls || [];
  if (!urls.length) return;
  urls.forEach(function(url) { window.open(url, '_blank'); });
}
function renderStudentCard(st, num, blockKey) {
  var bk = blockKey || 'F';
  var info = STUDENT_LOOKUP[st.name] || {};
  var card = document.createElement('div');
  card.className = 'student-card';
  var metaText = '';
  if (info.school) metaText = info.school + ' ' + (info.grade || '') + '학년';
  var linkKey1 = st.name + (st.subject ? ' ' + st.subject : '') + (st.clipboard ? '(' + st.clipboard + ')' : '');
  var linkKey2 = st.subject ? (st.name + ' ' + st.subject) : st.name;
  var url = linkMap[linkKey1] || linkMap[linkKey2] || linkMap[st.name] || '';
  var manager = managerMap[linkKey1] || managerMap[linkKey2] || managerMap[st.name] || '';
  var rawSeat   = st.seat || String(num);
  var seatMatch = rawSeat.match(/^(.+?)\s+(\d+)번$/);
  var seatNum   = seatMatch ? seatMatch[2] : (rawSeat.replace(/[^\d]/g, '') || String(num));
  var seatRoom  = seatMatch ? seatMatch[1].trim() : '';
  var linkHtml = url
    ? '<a class="link-btn link-btn-' + bk + '" href="' + escHtml(url) + '" target="_blank">📂 개별통합자료</a>'
    : '<div class="no-link-wrap">' +
        '<span class="no-link-msg">통합자료가 없어요</span>' +
        (mainSheetUrl ? '<a class="link-btn-main" href="' + escHtml(mainSheetUrl) + '" target="_blank">📋 메인시트</a>' : '') +
      '</div>';
  card.innerHTML =
    '<div class="seat-bar seat-bar-' + bk + '"></div>' +
    '<div class="seat-section">' +
      '<span class="seat-num seat-num-' + bk + '">' + escHtml(seatNum) + '</span>' +
      (seatRoom ? '<span class="seat-room">' + escHtml(seatRoom) + '</span>' : '') +
    '</div>' +
    '<div class="card-inner">' +
      '<div class="sc-body">' +
        '<div class="student-name">' + escHtml(st.name) + '</div>' +
        '<div class="student-tags">' +
          (st.subject   ? '<span class="st-tag tag-subject">' + escHtml(st.subject)   + '</span>' : '') +
          (metaText     ? '<span class="st-tag tag-meta">' + escHtml(metaText) + '</span>' : '') +
          (st.clipboard ? '<span class="st-tag tag-num">📋 ' + escHtml(st.clipboard) + '</span>' : '') +
          (manager      ? '<span class="st-tag tag-manager">👤 ' + escHtml(manager) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="sc-right">' + linkHtml + '</div>' +
    '</div>';
  return card;
}
// =====================================================
// 이번 주 스케줄
// =====================================================
function loadWeeklySchedule() {
  var weekLoading = document.getElementById('weekLoadingMsg');
  var weekError   = document.getElementById('weekErrorBanner');
  var weekContent = document.getElementById('weekContent');
  weekLoading.classList.add('visible');
  weekError.classList.remove('visible');
  weekContent.innerHTML = '';
  startWeekLoadingMsgs();
  google.script.run
    .withSuccessHandler(function(data) {
      stopWeekLoadingMsgs();
      weekLoading.classList.remove('visible');
      weeklyLoaded = true;
      renderWeeklySchedule(data);
    })
    .withFailureHandler(function(err) {
      stopWeekLoadingMsgs();
      weekLoading.classList.remove('visible');
      document.getElementById('weekErrorText').textContent = '스케줄을 불러오지 못했어요: ' + (err.message || err);
      weekError.classList.add('visible');
    })
    .getWeeklySchedule(currentTutor);
}
function startWeekLoadingMsgs() {
  var msgs = [
    '🗓️ 이번 주 시간표 분석 중...',
    '📖 시트 열심히 읽고 있어요...',
    '🔍 튜터님 수업 찾는 중...',
    '⏳ 조금만 기다려주세요!',
    '📊 데이터 정리 중...',
    '🚀 거의 다 왔어요!',
    '✨ 진짜 거의 다 왔어요!',
    '🙏 조금만요... 정말로요!',
  ];
  var idx = 0;
  var el = document.getElementById('weekLoadingText');
  if (weekMsgTimer) clearInterval(weekMsgTimer);
  weekMsgTimer = setInterval(function() {
    el.classList.add('fade');
    setTimeout(function() {
      idx = (idx + 1) % msgs.length;
      el.textContent = ' ' + msgs[idx];
      el.classList.remove('fade');
    }, 400);
  }, 2200);
}
function stopWeekLoadingMsgs() {
  if (weekMsgTimer) { clearInterval(weekMsgTimer); weekMsgTimer = null; }
}
function renderWeeklySchedule(data) {
  var weekContent = document.getElementById('weekContent');
  weekContent.innerHTML = '';
  var days = (data && data.days) || [];
  if (days.length === 0) {
    weekContent.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>이번 주에는 출근 일정이 없어요.</p></div>';
    return;
  }
  var todayStr = new Date().toISOString().slice(0,10);
  var weekDayNames = ['일','월','화','수','목','금','토'];
  // 요약 헤더
  var firstLabel = days[0].label;
  var lastLabel  = days[days.length - 1].label;
  var rangeText  = days.length === 1 ? firstLabel : (firstLabel + ' ~ ' + lastLabel);
  var summary = document.createElement('div');
  summary.className = 'week-summary';
  summary.innerHTML = '<strong>' + escHtml(currentTutor) + ' 튜터님</strong>의 이번 주 · ' +
    escHtml(rangeText) + ' · <strong>' + days.length + '일</strong> 출근';
  weekContent.appendChild(summary);
  // 날짜별 카드
  days.forEach(function(day) {
    var d = new Date(day.dateKey + 'T00:00:00');
    var dow = d.getDay();
    var isWeekend = (dow === 0 || dow === 6);
    var isToday   = day.dateKey === todayStr;
    var card = document.createElement('div');
    card.className = 'week-day-card' + (isToday ? ' today-card' : '');
    // ── 헤더 (클릭 시 펼침) ──
    var head = document.createElement('div');
    head.className = 'wdc-head';
    var wdBadge = document.createElement('span');
    wdBadge.className = 'wdc-weekday-badge' + (isWeekend ? ' weekend' : '');
    wdBadge.textContent = weekDayNames[dow] + '요일';
    var dateSpan = document.createElement('span');
    dateSpan.className = 'wdc-date';
    dateSpan.innerHTML = escHtml(day.label);
    if (isToday) {
      var todayDot = document.createElement('span');
      todayDot.className = 'today-dot'; todayDot.textContent = '오늘';
      dateSpan.appendChild(todayDot);
    }
    head.appendChild(wdBadge);
    head.appendChild(dateSpan);
    if (day.arrival) {
      var arrChip = document.createElement('span');
      arrChip.className = 'wdc-arrival';
      arrChip.textContent = '🚌 ' + day.arrival + ' 출근';
      head.appendChild(arrChip);
    }
    // 토글 화살표
    var toggle = document.createElement('span');
    toggle.className = 'wdc-toggle';
    toggle.textContent = '▾';
    head.appendChild(toggle);
    card.appendChild(head);
    // ── 블록 칩 요약 ──
    var blocksDiv = document.createElement('div');
    blocksDiv.className = 'wdc-blocks';
    (day.blocks || []).forEach(function(b) {
      var chip = document.createElement('div');
      chip.className = 'wdc-block-chip chip-text-' + b.block;
      var badge = document.createElement('div');
      badge.className = 'chip-badge chip-' + b.block;
      badge.textContent = b.block;
      var label = document.createElement('span');
      label.textContent = b.block + '콤마';
      chip.appendChild(badge);
      chip.appendChild(label);
      blocksDiv.appendChild(chip);
    });
    card.appendChild(blocksDiv);
    // ── 펼침 영역 (학생 카드 lazy load) ──
    var expand = document.createElement('div');
    expand.className = 'wdc-expand';
    expand.innerHTML = '<div class="wdc-student-loading"><span class="spinner"></span> 학생 목록 불러오는 중...</div>';
    card.appendChild(expand);
    // 클릭 핸들러
    (function(dayObj, expandEl) {
      head.addEventListener('click', function() {
        var isExpanded = card.classList.toggle('expanded');
        if (isExpanded && !weeklyDataCache[dayObj.dateKey]) {
          google.script.run
            .withSuccessHandler(function(result) {
              weeklyDataCache[dayObj.dateKey] = result;
              renderWeekExpand(expandEl, result, dayObj.dateKey);
            })
            .withFailureHandler(function(err) {
              expandEl.innerHTML = '<div class="wdc-student-loading" style="color:var(--danger)">⚠️ ' + escHtml(err.message || String(err)) + '</div>';
            })
            .getScheduleData(dayObj.dateKey, currentTutor, dayObj.gid);
        } else if (isExpanded && weeklyDataCache[dayObj.dateKey]) {
          renderWeekExpand(expandEl, weeklyDataCache[dayObj.dateKey], dayObj.dateKey);
        }
      });
    })(day, expand);
    weekContent.appendChild(card);
  });
}
function renderWeekExpand(expandEl, data, dateKey) {
  expandEl.innerHTML = '';
  if (!data || data.error) {
    expandEl.innerHTML = '<div class="wdc-student-loading" style="color:var(--danger)">⚠️ ' + escHtml((data && data.error) || '불러오기 실패') + '</div>';
    return;
  }
  if (!data.tutorFound || !data.blocks || Object.keys(data.blocks).length === 0) {
    expandEl.innerHTML = '<div class="wdc-student-loading">이 날은 수업이 없어요.</div>';
    return;
  }
  Object.keys(data.blocks).sort().forEach(function(bk) {
    var block = data.blocks[bk];
    var section = document.createElement('div');
    section.className = 'wdc-block-section';
    // 블록 헤더
    var hdr = document.createElement('div');
    hdr.className = 'wdc-block-header';
    hdr.innerHTML = '<div class="block-badge badge-' + bk + '">' + bk + '</div><span class="block-title">' + bk + '콤마</span>';
    if (block.arrival) {
      hdr.innerHTML += '<span class="arrival-chip" style="font-size:0.8rem;padding:2px 8px">🚌 ' + escHtml(block.arrival) + '</span>';
    }
    section.appendChild(hdr);
    // 학생 3열 그리드
    if (!block.students || block.students.length === 0) {
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:4px 0 8px;color:var(--muted);font-size:0.82rem';
      empty.textContent = '학생 없음';
      section.appendChild(empty);
    } else {
      var grid = document.createElement('div');
      grid.className = 'wdc-student-grid';
      block.students.forEach(function(st) {
        var card = document.createElement('div');
        card.className = 'wdc-mini-card';
        var sub = (st.subject || '') + (st.clipboard ? ' · 📋' + st.clipboard : '');
        var lk1 = st.name + (st.subject ? ' ' + st.subject : '') + (st.clipboard ? '(' + st.clipboard + ')' : '');
        var lk2 = st.subject ? (st.name + ' ' + st.subject) : st.name;
        var mgr = managerMap[lk1] || managerMap[lk2] || managerMap[st.name] || '';
        card.innerHTML =
          '<div class="wdc-mini-name">' + escHtml(st.name) + '</div>' +
          (sub ? '<div class="wdc-mini-sub">' + escHtml(sub) + '</div>' : '') +
          (mgr ? '<div class="wdc-mini-mgr">👤 ' + escHtml(mgr) + '</div>' : '');
        grid.appendChild(card);
      });
      section.appendChild(grid);
    }
    expandEl.appendChild(section);
  });
}
// =====================================================
// 헬퍼
// =====================================================
function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorBanner').classList.add('visible');
}
function clearResults() {
  document.getElementById('resultsArea').innerHTML = '';
  document.getElementById('errorBanner').classList.remove('visible');
  document.getElementById('loadingMsg').classList.remove('visible');
}
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
